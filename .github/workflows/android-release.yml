name: Android release

# This path publishes only the arm64 APK. Run it on a tested branch after
# reviewing the API 33/34/35 smoke artifacts; desktop and iOS bundles are not
# part of this release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example android-v0.2.8-preview.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  phones:
    name: Build and smoke-test Android only
    uses: ./.github/workflows/mobile.yml
    with:
      ref: ${{ github.ref_name }}
      sign: true
      android_only: true
    secrets: inherit

  publish:
    name: Publish arm64 APK
    needs: phones
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate tag against the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          if [[ ! "$TAG" =~ ^android-v${version}-preview\.[0-9]+$ ]]; then
            echo "::error::tag must be android-v${version}-preview.N"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Concat-android-arm64
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- Concat-*-android-arm64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Android preview
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Concat Plus Android ${{ inputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Android arm64 preview built from `${{ github.sha }}`. The APK is the only published application bundle.

            CI launches the app on Android API 30, 33, 34 and 35. Those launch checks validate installation and startup; they do not verify an export continuing while the app is backgrounded. The background export uses an Android foreground service and still needs a real-device export test for this exact build.

            This release contains the source under the GNU AGPL v3 license. See `LICENSE` and `docs/android/background-export.md`.
          files: |
            dist/Concat-*-android-arm64.apk
            dist/SHA256SUMS.txt

